server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: ${APP_NAME:mini-exchange}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog.xml
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:1}
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  docker:
    compose:
      file: compose.yml

app:
  security:
    secure-cookie: ${SESSION_COOKIE_SECURE:false}

exchange:
  matching:
    delay-ms: ${MATCHING_DELAY_MS:200}
  trading-day:
    end-time: ${TRADING_DAY_END_TIME:00:00:00}
    zone: ${TRADING_DAY_ZONE:Europe/Moscow}
    expiration-delay-ms: ${EXPIRATION_DELAY_MS:1000}
