name: ${APP_NAME:-mini-exchange}

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 20

  hurl:
    profiles: ["tests"]
    build:
      context: ./hurl
    env_file:
      - .env
    environment:
      APP_HOST: host.docker.internal
      DB_HOST: postgres
      DB_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["all"]

volumes:
  postgres-data:
